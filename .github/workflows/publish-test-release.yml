name: Publish signed Test update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studynotes-test-release
  cancel-in-progress: false

jobs:
  publish-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: test-release
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore release keystore
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          STUDYNOTES_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          STUDYNOTES_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STUDYNOTES_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in SIGNING_KEY_BASE64 STUDYNOTES_STORE_PASSWORD STUDYNOTES_KEY_ALIAS STUDYNOTES_KEY_PASSWORD; do
            test -n "${!v}" || { echo "::error::Missing secret $v"; exit 1; }
          done
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/studynotes-release.jks"
          chmod 600 "$RUNNER_TEMP/studynotes-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/studynotes-release.jks" -storepass "$STUDYNOTES_STORE_PASSWORD" -alias "$STUDYNOTES_KEY_ALIAS" >/dev/null

      - name: Build signed release
        env:
          STUDYNOTES_STORE_FILE: ${{ runner.temp }}/studynotes-release.jks
          STUDYNOTES_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          STUDYNOTES_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STUDYNOTES_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Read version and verify APK metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          t=open('app/build.gradle.kts',encoding='utf-8').read()
          code=re.search(r'versionCode\s*=\s*(\d+)',t).group(1)
          name=re.search(r'versionName\s*=\s*"([^"]+)"',t).group(1)
          assert re.fullmatch(r'\d+\.\d+\.\d+',name)
          print('code='+code)
          print('name='+name)
          PY
          SDK="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          expected_code="$(sed -n 's/^code=//p' "$GITHUB_OUTPUT")"
          expected_name="$(sed -n 's/^name=//p' "$GITHUB_OUTPUT")"
          "$SDK/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -F "versionCode='$expected_code' versionName='$expected_name'"
          "$SDK/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK as private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyNotesSFU-signed-test-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

      - name: Publish to Test update repository
        env:
          UPDATES_DEPLOY_KEY_BASE64: ${{ secrets.UPDATES_DEPLOY_KEY_BASE64 }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPDATES_DEPLOY_KEY_BASE64" || { echo "::error::Missing UPDATES_DEPLOY_KEY_BASE64"; exit 1; }
          mkdir -p "$HOME/.ssh"
          printf '%s' "$UPDATES_DEPLOY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/studynotes-updates-key"
          chmod 600 "$RUNNER_TEMP/studynotes-updates-key"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/studynotes-updates-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone --depth=1 git@github.com:Probnik67/StudyNotesSFU-Updates.git "$RUNNER_TEMP/updates"
          cd "$RUNNER_TEMP/updates"
          python3 - "$VERSION_CODE" <<'PY'
          import json,sys
          current=json.load(open('test.json',encoding='utf-8'))
          new=int(sys.argv[1]); old=int(current.get('versionCode',0))
          if new <= old: raise SystemExit(f'Refusing non-increasing versionCode {new} <= {old}')
          PY
          mkdir -p apk
          filename="StudyNotesSFU-v${VERSION_NAME}-release.apk"
          cp "$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk" "apk/$filename"
          cp "apk/$filename" apk/StudyNotesSFU-test-latest.apk
          python3 - "$VERSION_CODE" "$VERSION_NAME" "$filename" <<'PY'
          import json,sys
          code,name,filename=sys.argv[1:]
          data={'versionCode':int(code),'versionName':name,
                'apkUrl':f'https://raw.githubusercontent.com/Probnik67/StudyNotesSFU-Updates/main/apk/{filename}',
                'notes':f'Тестовая версия StudyNotesSFU {name}.',
                'required':False}
          with open('test.json','w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test.json apk/
          git commit -m "Publish StudyNotesSFU v${VERSION_NAME} to Test"
          git push origin HEAD:main
          echo "Published Test v${VERSION_NAME} (code ${VERSION_CODE})"
