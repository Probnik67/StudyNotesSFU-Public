name: Nightly Visual Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run first-frame emulator test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            ./gradlew --no-daemon connectedDebugAndroidTest
            test_exit=$?
            mkdir -p nightly-output/screenshots
            for screen in first-frame notes homework; do
              adb pull "/sdcard/Download/nightly-${screen}.png" "nightly-output/screenshots/nightly-${screen}.png" || true
            done
            adb logcat -d -s NightlySemantics:D '*:S' > nightly-output/compose-semantics.log || true
            exit "$test_exit"

      - name: Collect test outputs
        if: always()
        run: |
          mkdir -p nightly-output
          find app/build -type f \( -name "*.png" -o -name "*.html" -o -name "*.xml" \) -path "*androidTest*" -exec cp --parents {} nightly-output/ \; || true

      - name: Upload nightly smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StudyNotesSFU-nightly-smoke
          path: nightly-output
          if-no-files-found: warn
          retention-days: 7
